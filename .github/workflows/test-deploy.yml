name: Deploy TEST (test branch)

on:
  push:
    branches:
      - "test"
  workflow_dispatch:

permissions:
  contents: read

env:
  DBT_PROJECT_OBJECT_NAME: DATAHUB_DBT_MODELS

jobs:
  test_deploy_run:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for git diff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snowflake CLI + dbt
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade snowflake-cli dbt-core dbt-snowflake

      - name: Write Snowflake private key (from GitHub Environment secret)
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}" | tr -d '\n' | base64 -d > $HOME/sf_key.p8
          chmod 600 $HOME/sf_key.p8

      - name: Configure Snowflake CLI connection (ci)
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml <<'EOF'
          default_connection_name = "ci"
          [connections.ci]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          role = "${{ secrets.SNOWFLAKE_ROLE }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          database = "${{ secrets.SNOWFLAKE_PROJECT_DB }}"
          schema   = "${{ secrets.SNOWFLAKE_PROJECT_SCHEMA }}"
          authenticator = "SNOWFLAKE_JWT"
          private_key_path = "/home/runner/sf_key.p8"
          EOF
          chmod 0600 ~/.snowflake/config.toml

      # -----------------------------------------------------------------------
      # SELECTIVE BUILD LOGIC
      # Determines whether to run a FULL build or a SELECTIVE (state-based) build
      # based on which files changed in the push.
      #
      # FULL build is triggered when any of these are changed:
      #   - dbt_project.yml       (project config)
      #   - profiles.yml          (connection/environment config)
      #   - packages.yml          (package dependencies)
      #   - macros/**             (macros affect multiple downstream models)
      #   - .github/workflows/**  (pipeline config)
      #
      # SELECTIVE build is used for all other changes (SQL models, YAML tests/docs).
      # It uses dbt's state:modified+ selector against the previous manifest.json
      # to build only the changed model(s) and their downstream dependents.
      # -----------------------------------------------------------------------

      - name: Detect build scope (full vs selective)
        id: build_scope
        run: |
          # Get list of files changed compared to the previous commit on this branch
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Check if any config-level or macro files changed
          if echo "$CHANGED" | grep -qE \
            '(dbt_project\.yml|profiles\.yml|packages\.yml|datahub_refinery/macros/|\.github/workflows/)'; then
            echo "BUILD_TYPE=full" >> $GITHUB_OUTPUT
            echo "DBT_SELECTOR=path:models+" >> $GITHUB_OUTPUT
            echo ">>> CONFIG or MACRO change detected — running FULL build"
          else
            echo "BUILD_TYPE=selective" >> $GITHUB_OUTPUT
            echo "DBT_SELECTOR=state:modified+" >> $GITHUB_OUTPUT
            echo ">>> Model/YAML only change detected — running SELECTIVE build"
          fi

      - name: Download previous dbt manifest (for selective builds)
        if: steps.build_scope.outputs.BUILD_TYPE == 'selective'
        uses: dawidd6/action-download-artifact@v6
        with:
          name: dbt_artifacts_test
          path: previous-manifest/
          workflow: test-deploy.yml
          branch: test
          if_no_artifact_found: warn
        continue-on-error: true # First-ever run won't have a previous manifest — fall back gracefully

      - name: Fallback to full build if no previous manifest found
        id: manifest_check
        if: steps.build_scope.outputs.BUILD_TYPE == 'selective'
        run: |
          if [ -f "previous-manifest/manifest.json" ]; then
            echo "Previous manifest found — selective build will proceed"
            echo "USE_STATE=true" >> $GITHUB_OUTPUT
          else
            echo "No previous manifest found — falling back to FULL build"
            echo "USE_STATE=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # GOVERNANCE VALIDATION — runs before dbt build
      # Fails the pipeline (and blocks PREPROD promotion) if any model
      # is missing: description, domain tag, meta.owner, meta.data_classification
      # -----------------------------------------------------------------------
      - name: Validate governance metadata (tags, owner, classification)
        run: |
          pip install pyyaml --quiet
          python scripts/validate_metadata.py

      - name: Install dbt dependencies (packages)
        run: |
          cd datahub_refinery
          dbt deps --target test

      - name: Deploy dbt project object to DBTCENTRAL.TEST_* schema
        env:
          SNOWFLAKE_TEST_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_TEST_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          snow dbt deploy "${{ env.DBT_PROJECT_OBJECT_NAME }}" --source datahub_refinery --profiles-dir datahub_refinery --default-target test --force

      - name: Execute dbt build in Snowflake (TEST) — FULL build
        if: |
          steps.build_scope.outputs.BUILD_TYPE == 'full' ||
          steps.manifest_check.outputs.USE_STATE == 'false'
        env:
          SNOWFLAKE_TEST_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_TEST_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          echo "Running FULL build — all models"
          snow dbt execute "${{ env.DBT_PROJECT_OBJECT_NAME }}" build --target test --select "path:models+"

      - name: Execute dbt build in Snowflake (TEST) — SELECTIVE build (state:modified+)
        if: |
          steps.build_scope.outputs.BUILD_TYPE == 'selective' &&
          steps.manifest_check.outputs.USE_STATE == 'true'
        env:
          SNOWFLAKE_TEST_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_TEST_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          echo "Running SELECTIVE build — changed models + downstream only"
          snow dbt execute "${{ env.DBT_PROJECT_OBJECT_NAME }}" build \
            --target test \
            --select "state:modified+" \
            --state ./previous-manifest/

      - name: Run dbt tests (airbnb bronze)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/sf_key.p8
          SNOWFLAKE_TEST_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_TEST_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        working-directory: datahub_refinery
        run: |
          # Test scope mirrors build scope: selective for model changes, full for config/macro changes
          if [ "${{ steps.build_scope.outputs.BUILD_TYPE }}" == "selective" ] && \
             [ "${{ steps.manifest_check.outputs.USE_STATE }}" == "true" ]; then
            echo "Running SELECTIVE dbt tests (state:modified+)"
            dbt test \
              --select "state:modified+" \
              --state ../previous-manifest/ \
              --target test \
              --no-fail-fast \
              --profiles-dir .
          else
            echo "Running FULL dbt tests (all airbnb bronze models)"
            dbt test \
              --select "path:models/bronze_adf/airbnb+" \
              --target test \
              --no-fail-fast \
              --profiles-dir .
          fi
        continue-on-error: true # generate report even if some tests fail

      - name: Generate dbt test HTML report
        if: always()
        run: python scripts/dbt_report.py

      - name: Upload dbt test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt_test_report_test
          path: dbt_test_report.html
          if-no-files-found: warn

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt_artifacts_test
          path: |
            datahub_refinery/target/manifest.json
            datahub_refinery/target/run_results.json
          if-no-files-found: ignore
