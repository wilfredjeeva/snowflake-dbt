# Manual selective deploy - specific models -> TEST
# Purpose  : Rebuild/deploy a named set of models when the automated selective
#             path missed them, or for a targeted TEST check outside the PR flow.
# Trigger  : Manual only (workflow_dispatch).
# Branch   : Usually "test". Feature branch allowed for TEST-only experiments
#             (does NOT change the test git branch; only what Snowflake TEST runs).
# Selector : Any valid dbt --select expression.

name: manual-selective-deploy-to-test

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git ref to checkout (prefer test; feature/* only for TEST experiments)"
        required: true
        default: "test"
      dbt_selector:
        description: >
          dbt --select expression. Examples:
          'gold_elections_DimElectionCandidates' |
          'path:models/gold/elections/' |
          'path:models/bronze_adf/DWHMetadata/bronze_DWHMetadata_OutputTables.sql path:models/silver/DWHMetadata/silver_DWHMetadata_OutputTables.sql'
        required: true
      reason:
        description: "Reason for this targeted deploy (audit)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  selective_deploy_test:
    name: "Selective TEST  [${{ inputs.dbt_selector }}]"
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 360

    steps:
      - name: Log deploy parameters
        run: |
          echo "=================================================="
          echo "  SELECTIVE TEST DEPLOY"
          echo "  Branch   : ${{ inputs.branch }}"
          echo "  Selector : ${{ inputs.dbt_selector }}"
          echo "  Reason   : ${{ inputs.reason }}"
          echo "  Actor    : ${{ github.actor }}"
          echo "=================================================="

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dbt-${{ hashFiles('**/packages.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-dbt-

      - name: Install dbt and Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.9.4 dbt-snowflake==1.9.2 pyyaml "snowflake-cli==3.13.1"

      - name: Write Snowflake private key
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > $HOME/sf_key.p8
          chmod 600 $HOME/sf_key.p8

      - name: Validate governance metadata (tags, owner, classification)
        run: python scripts/validate_metadata.py

      - name: Install dbt packages
        run: |
          cd datahub_refinery
          dbt deps --target test

      - name: Write CI profiles.yml (test)
        env:
          SF_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER: ${{ secrets.SNOWFLAKE_USER }}
          SF_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SF_DB: ${{ secrets.SNOWFLAKE_DB }}
          SF_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SF_PASSPHRASE: ${{ secrets.SNOWFLAKE_KEY_PASSPHRASE }}
        run: |
          python3 - << 'PYEOF'
          import os, pathlib, json
          e = os.environ
          content = f"""datahub_refinery:
            target: test
            outputs:
              test:
                type: snowflake
                account: {json.dumps(e['SF_ACCOUNT'])}
                user: {json.dumps(e['SF_USER'])}
                role: {json.dumps(e['SF_ROLE'])}
                warehouse: {json.dumps(e['SF_WAREHOUSE'])}
                database: {json.dumps(e['SF_DB'])}
                schema: {json.dumps(e['SF_SCHEMA'])}
                private_key_path: "/home/runner/sf_key.p8"
                private_key_passphrase: {json.dumps(e['SF_PASSPHRASE'])}
                threads: 8
                client_session_keep_alive: true
                client_session_keep_alive_heartbeat_frequency: 900
          """
          pathlib.Path("datahub_refinery/profiles.yml").write_text(content)
          print("CI profiles.yml written for test.")
          PYEOF

      - name: "dbt build (selective) to TEST"
        timeout-minutes: 340
        working-directory: datahub_refinery
        run: |
          echo "Selector: ${{ inputs.dbt_selector }}"
          # dbt orders by DAG (bronze → silver → gold → snapshot/tests).
          # No --exclude: selector is explicit; excluded models are never selected.
          dbt build \
            --select "${{ inputs.dbt_selector }}" \
            --target test \
            --no-fail-fast \
            --profiles-dir .

      - name: Generate dbt test HTML report
        if: always() && hashFiles('datahub_refinery/target/run_results.json') != ''
        run: python scripts/dbt_report.py

      - name: Upload dbt test report
        if: always() && hashFiles('dbt_test_report.html') != ''
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: "dbt_report_test_selective_${{ github.run_id }}"
          path: dbt_test_report.html
          if-no-files-found: warn

      - name: Clean dbt artifacts before Snowflake deploy
        run: |
          rm -rf "$GITHUB_WORKSPACE/datahub_refinery/target"
          rm -rf "$GITHUB_WORKSPACE/datahub_refinery/logs"

      - name: Deploy dbt project object to Snowflake (TEST)
        env:
          PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml <<'EOF'
          default_connection_name = "ci"
          [connections.ci]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          role = "${{ secrets.SNOWFLAKE_ROLE }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          database = "${{ secrets.SNOWFLAKE_DBT_DATABASE }}"
          schema = "${{ secrets.SNOWFLAKE_DBT_SCHEMA }}"
          authenticator = "SNOWFLAKE_JWT"
          private_key_path = "/home/runner/sf_key.p8"
          EOF
          chmod 0600 ~/.snowflake/config.toml
          snow dbt deploy "TEST_DATATRANSFORMATIONS" \
            --source "$GITHUB_WORKSPACE/datahub_refinery" \
            --profiles-dir "$GITHUB_WORKSPACE/datahub_refinery" \
            --default-target test \
            --force
