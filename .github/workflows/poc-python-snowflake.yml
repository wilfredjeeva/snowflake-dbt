# Run a custom Python script against Snowflake using Environment secrets.
# Purpose  : On-demand (manual) runner for team automation scripts.
#             Each person commits their script under scripts/python_jobs/… and
#             points script_path at it when they click Run workflow.
# Trigger  : workflow_dispatch only (cron later).

name: poc-python-snowflake
run-name: "Python → ${{ inputs.target_env }}  [${{ inputs.run_title }}]"

on:
  workflow_dispatch:
    inputs:
      run_title:
        description: "Name shown in the Actions run list (your job / ticket)"
        required: true
        type: string
        default: "Snowflake Python job"
      target_env:
        description: "GitHub Environment (which Snowflake secrets to use)"
        required: true
        type: choice
        options:
          - DEV
          - test
          - preprod
          - prod
        default: DEV
      script_path:
        description: "Repo path to YOUR script (must already be on this branch)"
        required: true
        type: string
        default: "scripts/poc_snowflake_connect.py"

permissions:
  contents: read

jobs:
  run_python:
    name: "Python → ${{ inputs.target_env }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    timeout-minutes: 60

    steps:
      - name: Log parameters
        run: |
          echo "=================================================="
          echo "  Title  : ${{ inputs.run_title }}"
          echo "  Env    : ${{ inputs.target_env }}"
          echo "  Script : ${{ inputs.script_path }}"
          echo "  Branch : ${{ github.ref_name }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "=================================================="
          echo "Put your script under scripts/python_jobs/<team>/… then set script_path."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "snowflake-connector-python>=3.12.0" cryptography

      - name: Write Snowflake private key
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > $HOME/sf_key.p8
          chmod 600 $HOME/sf_key.p8

      - name: Run Python script
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DB: ${{ secrets.SNOWFLAKE_DB }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_KEY_PASSPHRASE }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/sf_key.p8
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          SCRIPT="${{ inputs.script_path }}"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Script not found on this branch: $SCRIPT"
            echo "Commit the file first, then Run workflow from a branch that contains it."
            exit 1
          fi
          python "$SCRIPT"

      - name: Cleanup private key
        if: always()
        run: rm -f $HOME/sf_key.p8
