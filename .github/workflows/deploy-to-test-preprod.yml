# CI/CD pipeline: feature -> test (PR merge) -> preprod (approval gate) -> main PR
# Triggered when a PR is merged into test, or manually via workflow_dispatch.

name: dandi-datahub-dbt-to-test-preprod
run-name: ${{ github.event.pull_request.title || 'Manual run (workflow_dispatch)' }}

on:
  pull_request:
    branches:
      - "test"
    types:
      - closed
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read
  pull-requests: write

env:
  DBT_PROJECT_OBJECT_NAME: datahub_refinery

jobs:
  # Stage 1 - Build: compile, governance check, capture the commit SHA.
  build:
    name: Build (Compile & Validate)
    runs-on: ubuntu-latest
    # Only run when a PR is actually merged (not just closed), or on manual dispatch.
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    outputs:
      deploy_sha: ${{ steps.capture_meta.outputs.sha }}
      build_type: ${{ steps.build_scope.outputs.BUILD_TYPE }}
      dbt_selector: ${{ steps.build_scope.outputs.DBT_SELECTOR }}
      pr_title: ${{ steps.capture_meta.outputs.pr_title }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Capture commit SHA and PR title
        id: capture_meta
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Pinned deploy SHA: $SHA"

          # Preserve the original PR title so the promote PR can reuse it.
          # This guarantees the promote PR title matches Conventional Commits lint rules
          # (the feature PR already passed lint before being merged into test).
          RAW_TITLE="${{ github.event.pull_request.title }}"
          if [ -z "$RAW_TITLE" ]; then
            RAW_TITLE="chore: promote test to main (manual dispatch)"
          fi
          # Sanitise: strip any characters that would break the gh CLI --title flag.
          SAFE_TITLE=$(echo "$RAW_TITLE" | tr -d '`"\\' | cut -c1-120)
          echo "pr_title=$SAFE_TITLE" >> $GITHUB_OUTPUT
          echo "Captured PR title: $SAFE_TITLE"

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dbt and Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.9.4 dbt-snowflake==1.9.2 pyyaml

      # Always selective - state:modified+ handles macro/config changes via SQL hash comparison.
      - name: Detect build scope (always selective)
        id: build_scope
        run: |
          # Use PR base/head SHAs for accurate diff when triggered by pull_request.
          # Falls back to HEAD~1 for workflow_dispatch.
          PR_BASE="${{ github.event.pull_request.base.sha }}"
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ]; then
            CHANGED=$(git diff --name-only "$PR_BASE" "$PR_HEAD" 2>/dev/null || true)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          fi
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE \
            '(dbt_project\.yml|profiles\.yml|packages\.yml|datahub_refinery/macros/|\.github/workflows/)'; then
            echo ">>> Config/macro/workflow change detected."
            echo ">>> state:modified+ detects affected models automatically via SQL hash comparison."
          else
            echo ">>> Model/YAML change only."
          fi

          echo "BUILD_TYPE=selective"         >> $GITHUB_OUTPUT
          echo "DBT_SELECTOR=state:modified+" >> $GITHUB_OUTPUT
          echo ">>> SELECTIVE build scheduled"

      - name: Validate governance metadata (tags, owner, classification)
        run: |
          pip install pyyaml --quiet
          python scripts/validate_metadata.py

      - name: Install dbt packages
        run: |
          cd datahub_refinery
          dbt deps --target test

      - name: dbt parse (compile / syntax check)
        working-directory: datahub_refinery
        run: |
          dbt parse --target test --profiles-dir .
          echo "dbt compile passed - project is syntactically valid."

  # Stage 2 - Deploy TEST: run dbt build on the exact tested commit.
  deploy_test:
    name: Deploy TEST
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 360
    needs: build

    outputs:
      deploy_sha: ${{ needs.build.outputs.deploy_sha }}
      build_type: ${{ needs.build.outputs.build_type }}
      dbt_selector: ${{ needs.build.outputs.dbt_selector }}
      pr_title: ${{ needs.build.outputs.pr_title }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.deploy_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dbt-${{ hashFiles('**/packages.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-dbt-

      - name: Install dbt and Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.9.4 dbt-snowflake==1.9.2 pyyaml "snowflake-cli==3.13.1"

      - name: Write Snowflake private key (from GitHub Environment secret)
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > $HOME/sf_key.p8
          chmod 600 $HOME/sf_key.p8

      # Tries to restore the manifest from the previous run for selective builds.
      - name: Restore previous manifest (for selective builds)
        id: manifest_cache
        if: needs.build.outputs.build_type == 'selective'
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: previous-manifest/manifest.json
          key: dbt-manifest-test-${{ github.run_id }}
          restore-keys: |
            dbt-manifest-test-

      - name: Fallback check - manifest found?
        id: manifest_check
        if: needs.build.outputs.build_type == 'selective'
        run: |
          if [ -f "previous-manifest/manifest.json" ]; then
            echo "Manifest found (from cache) - selective build with state comparison"
            echo "USE_STATE=true" >> $GITHUB_OUTPUT
          else
            echo "No manifest in cache - will use git-diff selector to stay selective"
            echo "USE_STATE=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate governance metadata (tags, owner, classification)
        run: |
          python scripts/validate_metadata.py

      - name: Install dbt packages
        run: |
          cd datahub_refinery
          dbt deps --target test

      - name: Write CI profiles.yml (test)
        env:
          SF_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER: ${{ secrets.SNOWFLAKE_USER }}
          SF_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SF_DB: ${{ secrets.SNOWFLAKE_DB }}
          SF_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SF_PASSPHRASE: ${{ secrets.SNOWFLAKE_KEY_PASSPHRASE }}
        run: |
          python3 - << 'PYEOF'
          import os, pathlib, json
          e = os.environ
          content = f"""datahub_refinery:
            target: test
            outputs:
              test:
                type: snowflake
                account: {json.dumps(e['SF_ACCOUNT'])}
                user: {json.dumps(e['SF_USER'])}
                role: {json.dumps(e['SF_ROLE'])}
                warehouse: {json.dumps(e['SF_WAREHOUSE'])}
                database: {json.dumps(e['SF_DB'])}
                schema: {json.dumps(e['SF_SCHEMA'])}
                private_key_path: "/home/runner/sf_key.p8"
                private_key_passphrase: {json.dumps(e['SF_PASSPHRASE'])}
                threads: 8
                client_session_keep_alive: true
                client_session_keep_alive_heartbeat_frequency: 900
          """
          pathlib.Path("datahub_refinery/profiles.yml").write_text(content)
          print("CI profiles.yml written for test.")
          PYEOF

      # dbt build runs models AND tests together.
      # Primary path  : state:modified.body   → only models where SQL body changed (no downstream cascade)
      #                 state:modified.macros+ → only models that depend on a changed macro + downstream
      # This prevents full builds: macro changes only rebuild affected models, not all 2800 objects.
      # Fallback path  : git-diff derived model selectors only (macro impact handled by primary path).
      - name: Build changed dbt models (selective - direct changes only)
        timeout-minutes: 340
        working-directory: datahub_refinery
        run: |
          # Compute accurate git diff once (PR base→head for PR events, HEAD~1 for dispatch)
          PR_BASE="${{ github.event.pull_request.base.sha }}"
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ]; then
            GIT_CHANGED=$(git diff --name-only "$PR_BASE" "$PR_HEAD" 2>/dev/null || true)
          else
            GIT_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi

          if [ "${{ steps.manifest_check.outputs.USE_STATE }}" == "true" ]; then
            echo "SELECTIVE build - state:modified.body state:modified.macros (SQL/macro changes + new models/tests, direct only - no downstream cascade)"
            dbt build \
              --select "state:modified.body state:modified.macros state:new" \
              --state ../previous-manifest/ \
              --target test --no-fail-fast --profiles-dir . 2>&1 | tee /tmp/selective_build.log
            DBT_EXIT=${PIPESTATUS[0]}
            if [ $DBT_EXIT -ne 0 ]; then
              exit $DBT_EXIT
            elif grep -q "Nothing to do" /tmp/selective_build.log; then
              echo "Selective build found nothing to run (re-run or YAML-only change scenario)"
              echo "Falling back to git-diff model selector to stay selective"
              MODEL_SELECTORS=$(echo "$GIT_CHANGED" \
                | grep -E '^datahub_refinery/models/.*\.sql$' \
                | sed 's|.*/||;s|\.sql$||;s|$|+|' \
                | tr '\n' ' ' | xargs)
              if [ -z "$MODEL_SELECTORS" ]; then
                echo "No model SQL changes found - nothing to build (macro impact handled by state:modified.macros+)"
                exit 0
              fi
              echo "Git-derived model selector: $MODEL_SELECTORS"
              dbt build --select $MODEL_SELECTORS --target test --no-fail-fast --profiles-dir .
            fi
          else
            echo "No manifest available - using git-diff model selector (no full build)"
            # Note: macro:name+ is not a valid dbt selector. Macro impact is handled by
            # state:modified.macros+ in the primary path once a manifest is available.
            MODEL_SELECTORS=$(echo "$GIT_CHANGED" \
              | grep -E '^datahub_refinery/models/.*\.sql$' \
              | sed 's|.*/||;s|\.sql$||;s|$|+|' \
              | tr '\n' ' ' | xargs)
            if [ -z "$MODEL_SELECTORS" ]; then
              echo "No model SQL changes found via git diff - nothing to build"
              exit 0
            fi
            echo "Git-derived model selector: $MODEL_SELECTORS"
            dbt build --select $MODEL_SELECTORS --target test --no-fail-fast --profiles-dir .
          fi

      - name: Generate dbt test HTML report
        if: always()
        run: python scripts/dbt_report.py

      - name: Upload dbt test report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dbt_test_report_test
          path: dbt_test_report.html
          if-no-files-found: warn

      - name: Save manifest to cache for next selective build
        if: always()
        run: |
          mkdir -p previous-manifest
          cp datahub_refinery/target/manifest.json previous-manifest/ 2>/dev/null || true

      - name: Cache manifest for next selective build
        if: always()
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: previous-manifest/manifest.json
          key: dbt-manifest-test-${{ github.run_id }}

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dbt_artifacts_test
          path: previous-manifest/
          if-no-files-found: ignore
          retention-days: 15

      # -----------------------------------------------------------------------
      # Reports and artifacts captured above. Now clean target/ and logs/ so
      # the Snowflake CLI only stages project source files (not compiled SQL
      # artifacts), avoiding the SecurePath "Cannot join path to a file" error.
      # dbt_packages/ is intentionally retained - it contains dbt_utils and
      # dbt_expectations macros that the Snowflake object needs at runtime.
      # -----------------------------------------------------------------------
      - name: Clean dbt artifacts before Snowflake deploy
        run: |
          rm -rf "$GITHUB_WORKSPACE/datahub_refinery/target"
          rm -rf "$GITHUB_WORKSPACE/datahub_refinery/logs"
          echo "Cleaned target/ and logs/ - dbt_packages/ retained for deploy"

      - name: Deploy dbt project object to Snowflake (TEST)
        env:
          PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml <<'EOF'
          default_connection_name = "ci"
          [connections.ci]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          role = "${{ secrets.SNOWFLAKE_ROLE }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          database = "${{ secrets.SNOWFLAKE_DBT_DATABASE }}"
          schema = "${{ secrets.SNOWFLAKE_DBT_SCHEMA }}"
          authenticator = "SNOWFLAKE_JWT"
          private_key_path = "/home/runner/sf_key.p8"
          EOF
          chmod 0600 ~/.snowflake/config.toml
          snow dbt deploy "TEST_DATATRANSFORMATIONS" \
            --source "$GITHUB_WORKSPACE/datahub_refinery" \
            --profiles-dir "$GITHUB_WORKSPACE/datahub_refinery" \
            --default-target test \
            --force

  # Stage 3 - Deploy PREPROD: waits for manual approval, then deploys the same commit.
  # Set required reviewers under Settings -> Environments -> preprod.
  deploy_preprod:
    name: Deploy PREPROD
    runs-on: ubuntu-latest
    environment: preprod
    timeout-minutes: 360
    needs: deploy_test

    outputs:
      deploy_sha: ${{ needs.deploy_test.outputs.deploy_sha }}
      build_type: ${{ needs.deploy_test.outputs.build_type }}
      dbt_selector: ${{ needs.deploy_test.outputs.dbt_selector }}
      pr_title: ${{ needs.deploy_test.outputs.pr_title }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Checks out the exact commit that passed TEST, after the approver clicks approve.
          ref: ${{ needs.deploy_test.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Verify checked-out SHA matches tested commit
        run: |
          EXPECTED="${{ needs.deploy_test.outputs.deploy_sha }}"
          ACTUAL=$(git rev-parse HEAD)
          echo "Expected SHA: $EXPECTED"
          echo "Actual SHA:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: SHA mismatch! Aborting to prevent deploying the wrong commit."
            exit 1
          fi
          echo "SHA verified - deploying the correct tested commit."

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dbt-${{ hashFiles('**/packages.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-dbt-

      - name: Install dbt and Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.9.4 dbt-snowflake==1.9.2 pyyaml "snowflake-cli==3.13.1"

      - name: Write Snowflake private key
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > $HOME/sf_key.p8
          chmod 600 $HOME/sf_key.p8

      - name: Validate governance metadata (tags, owner, classification)
        run: python scripts/validate_metadata.py

      - name: Install dbt packages
        run: |
          cd datahub_refinery
          dbt deps --target preprod

      - name: Write CI profiles.yml (preprod)
        env:
          SF_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER: ${{ secrets.SNOWFLAKE_USER }}
          SF_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SF_DB: ${{ secrets.SNOWFLAKE_DB }}
          SF_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SF_PASSPHRASE: ${{ secrets.SNOWFLAKE_KEY_PASSPHRASE }}
        run: |
          python3 - << 'PYEOF'
          import os, pathlib, json
          e = os.environ
          content = f"""datahub_refinery:
            target: preprod
            outputs:
              preprod:
                type: snowflake
                account: {json.dumps(e['SF_ACCOUNT'])}
                user: {json.dumps(e['SF_USER'])}
                role: {json.dumps(e['SF_ROLE'])}
                warehouse: {json.dumps(e['SF_WAREHOUSE'])}
                database: {json.dumps(e['SF_DB'])}
                schema: {json.dumps(e['SF_SCHEMA'])}
                private_key_path: "/home/runner/sf_key.p8"
                private_key_passphrase: {json.dumps(e['SF_PASSPHRASE'])}
                threads: 8
                client_session_keep_alive: true
                client_session_keep_alive_heartbeat_frequency: 900
          """
          pathlib.Path("datahub_refinery/profiles.yml").write_text(content)
          print("CI profiles.yml written for preprod.")
          PYEOF

      # Restore the manifest from the PREVIOUS successful PREPROD run.
      # IMPORTANT: This MUST be a PREPROD manifest (not TEST).
      # dbt bakes the target database+schema into each node's config hash.
      # Comparing a PREPROD manifest against a TEST manifest causes every
      # model's hash to differ → dbt sees all models as "modified" → full build.
      # Using a PREPROD-to-PREPROD comparison ensures only truly changed
      # models are selected by state:modified+.
      - name: Restore PREPROD manifest for selective build
        id: manifest_cache
        if: needs.deploy_test.outputs.build_type == 'selective'
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: previous-manifest/manifest.json
          key: dbt-manifest-preprod-${{ github.run_id }}
          restore-keys: |
            dbt-manifest-preprod-

      - name: Fallback check - manifest found?
        id: manifest_check
        if: needs.deploy_test.outputs.build_type == 'selective'
        run: |
          if [ -f "previous-manifest/manifest.json" ]; then
            echo "Manifest found (from previous PREPROD run) - selective build with state comparison"
            echo "USE_STATE=true" >> $GITHUB_OUTPUT
          else
            echo "No PREPROD manifest in cache - will use git-diff selector to stay selective"
            echo "USE_STATE=false" >> $GITHUB_OUTPUT
          fi

      # Always selective - mirrors TEST. state:modified.body state:modified.macros prevents full builds.
      - name: Build dbt models (selective - direct changes only)
        timeout-minutes: 340
        working-directory: datahub_refinery
        run: |
          # Compute accurate git diff once (PR base→head for PR events, HEAD~1 for dispatch)
          PR_BASE="${{ github.event.pull_request.base.sha }}"
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ]; then
            GIT_CHANGED=$(git diff --name-only "$PR_BASE" "$PR_HEAD" 2>/dev/null || true)
          else
            GIT_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi

          if [ "${{ steps.manifest_check.outputs.USE_STATE }}" == "true" ]; then
            echo "SELECTIVE build - state:modified.body state:modified.macros (SQL/macro changes + new models/tests, direct only - no downstream cascade)"
            dbt build \
              --select "state:modified.body state:modified.macros state:new" \
              --exclude "platinum_ai_mosaic_poc_temp_mosaicicssubgroupdetails platinum_ai_mosaic_poc_temp_mosaicicsworkflowendsteps platinum_ai_mosaic_poc_temp_mosaicicsworkflownextactions platinum_ai_mosaic_poc_temp_mosaicicsworkflowsteps platinum_ai_mosaic_poc_temp_mosaicorganisations platinum_ai_mosaic_poc_temp_mosaicworkers" \
              --exclude "silver_Ezytreev_ordworks,test_name:expression_is_true" \
              --state ../previous-manifest/ \
              --target preprod --no-fail-fast --profiles-dir . 2>&1 | tee /tmp/selective_build.log
            DBT_EXIT=${PIPESTATUS[0]}
            if [ $DBT_EXIT -ne 0 ]; then
              exit $DBT_EXIT
            elif grep -q "Nothing to do" /tmp/selective_build.log; then
              echo "Selective build found nothing to run (re-run or YAML-only change scenario)"
              echo "Falling back to git-diff model selector to stay selective"
              MODEL_SELECTORS=$(echo "$GIT_CHANGED" \
                | grep -E '^datahub_refinery/models/.*\.sql$' \
                | sed 's|.*/||;s|\.sql$||;s|$|+|' \
                | tr '\n' ' ' | xargs)
              if [ -z "$MODEL_SELECTORS" ]; then
                echo "No model SQL changes found - nothing to build (macro impact handled by state:modified.macros+)"
                exit 0
              fi
              echo "Git-derived model selector: $MODEL_SELECTORS"
              dbt build --select $MODEL_SELECTORS \
                --exclude "platinum_ai_mosaic_poc_temp_mosaicicssubgroupdetails platinum_ai_mosaic_poc_temp_mosaicicsworkflowendsteps platinum_ai_mosaic_poc_temp_mosaicicsworkflownextactions platinum_ai_mosaic_poc_temp_mosaicicsworkflowsteps platinum_ai_mosaic_poc_temp_mosaicorganisations platinum_ai_mosaic_poc_temp_mosaicworkers" \
                --exclude "silver_Ezytreev_ordworks,test_name:expression_is_true" \
                --target preprod --no-fail-fast --profiles-dir .
            fi
          else
            echo "No manifest available - using git-diff model selector (no full build)"
            # Note: macro:name+ is not a valid dbt selector. Macro impact is handled by
            # state:modified.macros+ in the primary path once a manifest is available.
            MODEL_SELECTORS=$(echo "$GIT_CHANGED" \
              | grep -E '^datahub_refinery/models/.*\.sql$' \
              | sed 's|.*/||;s|\.sql$||;s|$|+|' \
              | tr '\n' ' ' | xargs)
            if [ -z "$MODEL_SELECTORS" ]; then
              echo "No model SQL changes found via git diff - nothing to build"
              exit 0
            fi
            echo "Git-derived model selector: $MODEL_SELECTORS"
            dbt build --select $MODEL_SELECTORS \
              --exclude "platinum_ai_mosaic_poc_temp_mosaicicssubgroupdetails platinum_ai_mosaic_poc_temp_mosaicicsworkflowendsteps platinum_ai_mosaic_poc_temp_mosaicicsworkflownextactions platinum_ai_mosaic_poc_temp_mosaicicsworkflowsteps platinum_ai_mosaic_poc_temp_mosaicorganisations platinum_ai_mosaic_poc_temp_mosaicworkers" \
              --exclude "silver_Ezytreev_ordworks,test_name:expression_is_true" \
              --target preprod --no-fail-fast --profiles-dir .
          fi

      - name: Generate dbt test HTML report
        if: always()
        run: python scripts/dbt_report.py

      - name: Upload dbt test report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dbt_test_report_preprod
          path: dbt_test_report.html
          if-no-files-found: warn

      - name: Upload dbt artifacts (manifest + run results)
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dbt_artifacts_preprod
          path: |
            datahub_refinery/target/manifest.json
            datahub_refinery/target/run_results.json
          if-no-files-found: ignore
          retention-days: 15

      # Save the PREPROD manifest so the NEXT PREPROD run can use it for
      # state:modified+ comparison (PREPROD-to-PREPROD, same DB/schema configs).
      - name: Save PREPROD manifest for next selective build
        if: always()
        run: |
          mkdir -p preprod-manifest
          if cp datahub_refinery/target/manifest.json preprod-manifest/ 2>/dev/null; then
            echo "PREPROD manifest saved for next selective build."
          else
            echo "WARNING: manifest.json not found in target/ - skipping cache save (build may have failed before compile)."
          fi

      - name: Cache PREPROD manifest for next selective build
        if: always()
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: preprod-manifest/manifest.json
          key: dbt-manifest-preprod-${{ github.run_id }}

      # Write build_type to a file artifact so prod-deploy.yml can mirror
      # the same selective/full decision without re-running the detection logic.
      - name: Save build type for PROD to consume
        if: always()
        run: |
          mkdir -p /tmp/build-meta
          echo "${{ needs.deploy_test.outputs.build_type }}" > /tmp/build-meta/build_type.txt
          echo "Build type saved: ${{ needs.deploy_test.outputs.build_type }}"

      - name: Upload build type artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pipeline-build-meta
          path: /tmp/build-meta/build_type.txt
          if-no-files-found: warn
          retention-days: 15

      # -----------------------------------------------------------------------
      # Reports and artifacts captured above. Now clean target/ and logs/ so
      # the Snowflake CLI only stages project source files (not compiled SQL
      # artifacts), avoiding the SecurePath "Cannot join path to a file" error.
      # dbt_packages/ is intentionally retained - it contains dbt_utils and
      # dbt_expectations macros that the Snowflake object needs at runtime.
      # -----------------------------------------------------------------------
      - name: Clean dbt artifacts before Snowflake deploy
        run: |
          rm -rf "$GITHUB_WORKSPACE/datahub_refinery/target"
          rm -rf "$GITHUB_WORKSPACE/datahub_refinery/logs"
          echo "Cleaned target/ and logs/ - dbt_packages/ retained for deploy"

      - name: Deploy dbt project object to Snowflake (PREPROD)
        env:
          PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml <<'EOF'
          default_connection_name = "ci"
          [connections.ci]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          role = "${{ secrets.SNOWFLAKE_ROLE }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          database = "${{ secrets.SNOWFLAKE_DBT_DATABASE }}"
          schema = "${{ secrets.SNOWFLAKE_DBT_SCHEMA }}"
          authenticator = "SNOWFLAKE_JWT"
          private_key_path = "/home/runner/sf_key.p8"
          EOF
          chmod 0600 ~/.snowflake/config.toml
          snow dbt deploy "PREPROD_DATATRANSFORMATIONS" \
            --source "$GITHUB_WORKSPACE/datahub_refinery" \
            --profiles-dir "$GITHUB_WORKSPACE/datahub_refinery" \
            --default-target preprod \
            --force

  # Stage 4 - Promote: opens an isolated promotion PR to main once preprod passes.
  # Merge the PR to kick off the prod deploy workflow.
  promote_tested_commit_to_main:
    name: Promote Tested Commit to Main
    runs-on: ubuntu-latest
    needs: [deploy_test, deploy_preprod]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote tested commit to main
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.deploy_preprod.outputs.deploy_sha }}
          ORIGINAL_PR_TITLE: ${{ needs.deploy_preprod.outputs.pr_title }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git fetch origin main test

          # Confirm the SHA exists before doing anything.
          git cat-file -e "$COMMIT_SHA^{commit}"
          echo "SHA validated: $COMMIT_SHA exists."

          SHORT_SHA="${COMMIT_SHA:0:7}"

          # -----------------------------------------------------------------------
          # workflow_dispatch: open a direct test -> main PR.
          # This brings ALL accumulated changes from test into main at once,
          # covering any PRs that were merged into test but not yet promoted.
          # Uses a Conventional Commits-compliant title so lint passes.
          # -----------------------------------------------------------------------
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "Manual dispatch - opening test -> main PR to promote all accumulated changes."

            if git diff --quiet origin/main...origin/test; then
              echo "Nothing to promote - test is already in main. Skipping PR."
              exit 0
            fi

            cat > body.md <<EOF
          ## 🚀 Promotion: test → main (manual dispatch)

          All pipeline stages passed. This PR promotes **all changes** currently in \`test\`
          that have not yet been merged into \`main\`.

          | Stage | Status |
          |-------|--------|
          | ✅ Build (compile + governance) | Passed |
          | ✅ Deploy TEST | Passed |
          | ✅ Deploy PREPROD (approved) | Passed |

          - **Triggered by:** manual workflow_dispatch
          - **Workflow:** \`${GITHUB_WORKFLOW}\`
          - **Run:** \`${GITHUB_RUN_ID}\`

          > _Merge this PR to trigger the PROD deploy workflow._
          EOF

            gh pr create \
              --base main \
              --head test \
              --title "chore: promote test to main (manual dispatch)" \
              --body-file body.md \
            || echo "PR may already exist; continuing."

            exit 0
          fi

          # -----------------------------------------------------------------------
          # pull_request event: cherry-pick the exact tested commit.
          # Each merged PR gets its own isolated promote-SHA branch and PR to main.
          #
          # TITLE STRATEGY: reuse the original feature PR title verbatim.
          # Since that PR passed the Conventional Commits lint check before being
          # merged into test, the promote PR title is guaranteed to pass too.
          # This also surfaces the dbt model name (e.g. feat(DHE-2812): permit_details-...)
          # directly in the PR list, making it easy to trace what was promoted.
          # -----------------------------------------------------------------------
          PROMO_BRANCH="promote-${SHORT_SHA}"
          echo "PR merge - promoting commit $COMMIT_SHA via branch $PROMO_BRANCH"

          # Skip if commit is already in main.
          if git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "Nothing to promote - commit already in main. Skipping PR."
            exit 0
          fi

          # Create promotion branch from main.
          git checkout -B "$PROMO_BRANCH" origin/main

          CHERRY_PICK_OK=true

          # Handle merge commits (cherry-pick -m 1) vs normal commits.
          if git rev-parse "${COMMIT_SHA}^2" >/dev/null 2>&1; then
            echo "Merge commit detected; cherry-picking with -m 1"
            if ! git cherry-pick -m 1 "$COMMIT_SHA"; then
              CHERRY_PICK_OK=false
            fi
          else
            echo "Normal commit; cherry-picking without -m"
            if ! git cherry-pick "$COMMIT_SHA"; then
              CHERRY_PICK_OK=false
            fi
          fi

          # Skip if cherry-pick produced no diff (already in main).
          if [[ "$CHERRY_PICK_OK" == "true" ]] && git diff --quiet origin/main...HEAD; then
            echo "Nothing to promote; already in main or empty cherry-pick."
            exit 0
          fi

          echo "Pushing branch..."
          git push -u origin "$PROMO_BRANCH" --force-with-lease

          # Use the original feature PR title as the promote PR title.
          # Falls back to a conventional-commits-safe default if empty.
          # Append [promote] so the PR is clearly identifiable as a promotion PR
          # in the PR list while still passing the Conventional Commits lint check.
          BASE_TITLE="${ORIGINAL_PR_TITLE:-chore: promote ${SHORT_SHA} to main}"
          PROMOTE_TITLE="${BASE_TITLE} [promote]"

          cat > body.md <<EOF
          ## 🚀 Ready to merge to PROD - all gates passed ✅

          This PR promotes the changes from **\`${PROMOTE_TITLE}\`** through to \`main\`
          after successfully passing all pipeline stages.

          | Stage | Status |
          |-------|--------|
          | ✅ Build (compile + governance) | Passed |
          | ✅ Deploy TEST | Passed |
          | ✅ Deploy PREPROD (approved) | Passed |

          **Pinned commit SHA:** \`${COMMIT_SHA}\`
          **Short SHA:** \`${SHORT_SHA}\`
          **Workflow:** \`${GITHUB_WORKFLOW}\`
          **Run:** [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          **Promotion branch:** \`${PROMO_BRANCH}\`

          > Merge this PR to trigger the PROD deploy workflow.
          EOF

          if [[ "$CHERRY_PICK_OK" == "false" ]]; then
            cat >> body.md <<EOF

          ⚠️ **Cherry-pick conflict detected**
          This PR was created to allow manual conflict resolution before merging to main.
          EOF
          fi

          echo "Creating PR $PROMO_BRANCH -> main with title: $PROMOTE_TITLE"
          gh pr create \
            --base main \
            --head "$PROMO_BRANCH" \
            --title "$PROMOTE_TITLE" \
            --body-file body.md \
          || echo "PR may already exist; continuing."
