name: Build and Validate (PR)

# Runs on every pull request targeting the test or main branch.
# The job name 'build' matches the required status check configured
# in the branch protection rules.
#
# No Snowflake connection is made here - dbt parse is a local operation.
# This gives developers fast feedback (~2 min) before their changes are
# merged to test and the full deploy pipeline runs.

on:
  pull_request:
    branches:
      - test  # feature → test PRs (developer changes)
      - main  # test → main PRs (promotion to prod gate)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dbt-${{ hashFiles('**/packages.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-dbt-

      - name: Install dbt and Python dependencies
        run: |
          python -m pip install --upgrade pip
          # dbt-snowflake is needed so dbt parse recognises the adapter config.
          # No actual Snowflake connection is made during parse.
          pip install dbt-core==1.9.4 dbt-snowflake==1.9.2 pyyaml

      # -------------------------------------------------------------------
      # GOVERNANCE VALIDATION
      # Fails the PR check if any model is missing required metadata
      # (tags, owner, classification). Blocks merge until resolved.
      # -------------------------------------------------------------------
      - name: Validate governance metadata (tags, owner, classification)
        run: |
          python scripts/validate_metadata.py

      - name: Install dbt dependencies (packages)
        run: |
          cd datahub_refinery
          dbt deps --target test

      # -------------------------------------------------------------------
      # dbt parse — validates all SQL and YAML files compile correctly.
      # Catches Jinja errors, missing refs, bad configs before a full run.
      # Does NOT connect to Snowflake.
      # -------------------------------------------------------------------
      - name: Parse dbt project (syntax + ref validation)
        working-directory: datahub_refinery
        run: |
          echo "Running dbt parse to catch SQL/YAML errors..."
          dbt parse --profiles-dir . --target test
          echo "dbt parse completed successfully"
