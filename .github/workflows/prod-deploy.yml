name: Deploy PROD (push to main)

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prod_deploy_run:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 45

    # Runs automatically on push to main (i.e. after a test-main PR is reviewed, approved, and merged).
    # The prod environment gate pauses the job until an approver confirms in GitHub Actions UI.
    # Also supports manual runs via workflow_dispatch.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dbt-${{ hashFiles('**/packages.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-dbt-

      - name: Install dbt and Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.9.4 dbt-snowflake==1.9.2 pyyaml "snowflake-cli==3.13.1"

      - name: Write Snowflake private key (from GitHub Environment secret)
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > $HOME/sf_key.p8
          chmod 600 $HOME/sf_key.p8

      # -----------------------------------------------------------------------
      # Read the build type (selective / full) that was decided by the unified
      # pipeline when this commit passed TEST and PREPROD.
      # We download the artifact uploaded by deploy_preprod, which contains a
      # single file: build_type.txt with value "selective" or "full".
      # Falls back to "full" if the artifact is unavailable (manual dispatch,
      # artifact expired, first-ever run, etc.).
      # -----------------------------------------------------------------------
      - name: Download build type from unified pipeline
        id: download_meta
        continue-on-error: true
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: pipeline-build-meta
          path: /tmp/build-meta

      - name: Read build type
        id: build_scope
        run: |
          if [ -f "/tmp/build-meta/build_type.txt" ]; then
            BUILD_TYPE=$(cat /tmp/build-meta/build_type.txt | tr -d '[:space:]')
            echo "Build type from unified pipeline: $BUILD_TYPE"
          else
            BUILD_TYPE="full"
            echo "No build type artifact found - defaulting to FULL build"
          fi
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # GOVERNANCE VALIDATION - runs before dbt build.
      # Fails the pipeline (and blocks PROD promotion) if any model
      # is missing required metadata.
      # -----------------------------------------------------------------------
      - name: Validate governance metadata (tags, owner, classification)
        run: |
          python scripts/validate_metadata.py

      - name: Install dbt dependencies (packages)
        run: |
          cd datahub_refinery
          dbt deps --target prod

      - name: Write CI profiles.yml
        env:
          SF_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER: ${{ secrets.SNOWFLAKE_USER }}
          SF_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SF_DB: ${{ secrets.SNOWFLAKE_DB }}
          SF_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SF_PASSPHRASE: ${{ secrets.SNOWFLAKE_KEY_PASSPHRASE }}
        run: |
          python3 - << 'PYEOF'
          import os, pathlib, json
          e = os.environ
          content = f"""datahub_refinery:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: {json.dumps(e['SF_ACCOUNT'])}
                user: {json.dumps(e['SF_USER'])}
                role: {json.dumps(e['SF_ROLE'])}
                warehouse: {json.dumps(e['SF_WAREHOUSE'])}
                database: {json.dumps(e['SF_DB'])}
                schema: {json.dumps(e['SF_SCHEMA'])}
                private_key_path: "/home/runner/sf_key.p8"
                private_key_passphrase: {json.dumps(e['SF_PASSPHRASE'])}
                threads: 8
          """
          pathlib.Path("datahub_refinery/profiles.yml").write_text(content)
          print("CI profiles.yml written for prod")
          PYEOF

      # -----------------------------------------------------------------------
      # Restore the PROD manifest for selective builds.
      # A prod-specific manifest is used (not the test/preprod one) because
      # the prod database state is independent of lower environments.
      # Falls back to a full build if no manifest is found in cache.
      # -----------------------------------------------------------------------
      - name: Restore previous PROD manifest (for selective builds)
        id: manifest_cache
        if: steps.build_scope.outputs.BUILD_TYPE == 'selective'
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: previous-manifest/manifest.json
          key: dbt-manifest-prod-${{ github.run_id }}
          restore-keys: |
            dbt-manifest-prod-

      - name: Fallback check - manifest found?
        id: manifest_check
        if: steps.build_scope.outputs.BUILD_TYPE == 'selective'
        run: |
          if [ -f "previous-manifest/manifest.json" ]; then
            echo "Manifest found (from cache) - selective build with state comparison"
            echo "USE_STATE=true" >> $GITHUB_OUTPUT
          else
            echo "No manifest in cache - will fall back to full build"
            echo "USE_STATE=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # PROD build mirrors the TEST/PREPROD build mode exactly:
      #   selective → build only changed models + downstream (state:modified+)
      #   full      → build all models (path:models+)
      # Note: --full-refresh is NOT used in selective mode to preserve
      # incremental model history. It IS used for full builds.
      # TODO: Remove --exclude below once fixed by the UK team (target: next tranche):
      #       UDF issue (UDF_GET_TIME_OF_DAY_KEY missing in PREPROD):
      #         - gold_dbo_DimAges, gold_dbo_DimTimeOfDay, gold_dbo_DimDaysOfWeek, gold_dbo_DimPeriods
      #       Governance tag issue (SENSITIVEDATASET_TAG, SOURCESYSTEM_TAG, DATASET_TAG missing):
      #         - platinum_dbo_DaysOfWeek, platinum_dbo_TimeOfDay, platinum_dbo_Periods
      # -----------------------------------------------------------------------
      - name: Build dbt models (mirrors TEST/PREPROD build mode)
        timeout-minutes: 30
        working-directory: datahub_refinery
        run: |
          BUILD_TYPE="${{ steps.build_scope.outputs.BUILD_TYPE }}"
          USE_STATE="${{ steps.manifest_check.outputs.USE_STATE }}"

          if [ "$BUILD_TYPE" == "full" ]; then
            echo "FULL build - all models (config/macro/workflow change, or fallback)"
            dbt build \
              --select "path:models+" \
              --exclude "gold_dbo_DimAges gold_dbo_DimTimeOfDay gold_dbo_DimDaysOfWeek gold_dbo_DimPeriods platinum_dbo_DaysOfWeek platinum_dbo_TimeOfDay platinum_dbo_Periods" \
              --target prod \
              --no-fail-fast \
              --full-refresh \
              --profiles-dir .

          elif [ "$USE_STATE" == "true" ]; then
            echo "SELECTIVE build - state:modified+ (changed + downstream only)"
            dbt build \
              --select "state:modified+" \
              --exclude "gold_dbo_DimAges gold_dbo_DimTimeOfDay gold_dbo_DimDaysOfWeek gold_dbo_DimPeriods platinum_dbo_DaysOfWeek platinum_dbo_TimeOfDay platinum_dbo_Periods" \
              --state ../previous-manifest/ \
              --target prod \
              --no-fail-fast \
              --profiles-dir . 2>&1 | tee /tmp/selective_build.log
            DBT_EXIT=${PIPESTATUS[0]}
            if [ $DBT_EXIT -ne 0 ]; then
              exit $DBT_EXIT
            elif grep -q "Nothing to do" /tmp/selective_build.log; then
              echo "Selective build found nothing to run (stale manifest) - falling back to FULL build"
              dbt build \
                --select "path:models+" \
                --exclude "gold_dbo_DimAges gold_dbo_DimTimeOfDay gold_dbo_DimDaysOfWeek gold_dbo_DimPeriods platinum_dbo_DaysOfWeek platinum_dbo_TimeOfDay platinum_dbo_Periods" \
                --target prod \
                --no-fail-fast \
                --full-refresh \
                --profiles-dir .
            fi

          else
            echo "Selective requested but no manifest available - falling back to FULL build"
            dbt build \
              --select "path:models+" \
              --exclude "gold_dbo_DimAges gold_dbo_DimTimeOfDay gold_dbo_DimDaysOfWeek gold_dbo_DimPeriods platinum_dbo_DaysOfWeek platinum_dbo_TimeOfDay platinum_dbo_Periods" \
              --target prod \
              --no-fail-fast \
              --full-refresh \
              --profiles-dir .
          fi

      - name: Generate dbt test HTML report
        if: always()
        run: python scripts/dbt_report.py

      - name: Upload dbt test report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dbt_test_report_prod
          path: dbt_test_report.html
          if-no-files-found: warn

      - name: Save manifest to cache for next selective build
        if: always()
        run: |
          mkdir -p previous-manifest
          cp datahub_refinery/target/manifest.json previous-manifest/ 2>/dev/null || true

      - name: Cache PROD manifest for next selective build
        if: always()
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: previous-manifest/manifest.json
          key: dbt-manifest-prod-${{ github.run_id }}

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dbt_artifacts_prod
          path: |
            datahub_refinery/target/manifest.json
            datahub_refinery/target/run_results.json
          if-no-files-found: ignore
          retention-days: 15

      # -----------------------------------------------------------------------
      # Reports and artifacts captured above. Now clean target/ and logs/ so
      # the Snowflake CLI only stages project source files (not compiled SQL
      # artifacts), avoiding the SecurePath "Cannot join path to a file" error.
      # dbt_packages/ is intentionally retained - it contains dbt_utils and
      # dbt_expectations macros that the Snowflake object needs at runtime.
      # -----------------------------------------------------------------------
      - name: Clean dbt artifacts before Snowflake deploy
        run: |
          rm -rf "$GITHUB_WORKSPACE/datahub_refinery/target"
          rm -rf "$GITHUB_WORKSPACE/datahub_refinery/logs"
          echo "Cleaned target/ and logs/ - dbt_packages/ retained for deploy"

      - name: Deploy dbt project object to Snowflake (PROD)
        env:
          PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml <<'EOF'
          default_connection_name = "ci"
          [connections.ci]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          role = "${{ secrets.SNOWFLAKE_ROLE }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          database = "${{ secrets.SNOWFLAKE_DBT_DATABASE }}"
          schema = "${{ secrets.SNOWFLAKE_DBT_SCHEMA }}"
          authenticator = "SNOWFLAKE_JWT"
          private_key_path = "/home/runner/sf_key.p8"
          EOF
          chmod 0600 ~/.snowflake/config.toml
          snow dbt deploy "PROD_DATATRANSFORMATIONS" \
            --source "$GITHUB_WORKSPACE/datahub_refinery" \
            --profiles-dir "$GITHUB_WORKSPACE/datahub_refinery" \
            --default-target prod \
            --force
