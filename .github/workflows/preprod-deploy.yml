name: Deploy PREPROD (after TEST success)

on:
  workflow_run:
    workflows: ["Deploy TEST (test branch)"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read # needed to download artifacts from previous runs

jobs:
  preprod_deploy_run:
    runs-on: ubuntu-latest
    environment: preprod

    # Only trigger automatically if the TEST workflow succeeded on the 'test' branch.
    # workflow_dispatch bypasses this condition so manual runs always proceed.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'test')

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.9.4 dbt-snowflake==1.9.2

      - name: Write Snowflake private key (from GitHub Environment secret)
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > $HOME/sf_key.p8
          chmod 600 $HOME/sf_key.p8

      # -----------------------------------------------------------------------
      # GOVERNANCE VALIDATION — runs before dbt build
      # Fails the pipeline (and blocks PROD promotion) if any model
      # is missing required metadata.
      # -----------------------------------------------------------------------
      - name: Validate governance metadata (tags, owner, classification)
        run: |
          pip install pyyaml --quiet
          python scripts/validate_metadata.py

      - name: Install dbt dependencies (packages)
        run: |
          cd datahub_refinery
          dbt deps --target preprod

      - name: Write CI profiles.yml
        env:
          SF_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER: ${{ secrets.SNOWFLAKE_USER }}
          SF_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SF_DB: ${{ secrets.SNOWFLAKE_DB }}
          SF_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SF_PASSPHRASE: ${{ secrets.SNOWFLAKE_KEY_PASSPHRASE }}
        run: |
          python3 - << 'PYEOF'
          import os, pathlib, json
          e = os.environ
          content = f"""datahub_refinery:
            target: preprod
            outputs:
              preprod:
                type: snowflake
                account: {json.dumps(e['SF_ACCOUNT'])}
                user: {json.dumps(e['SF_USER'])}
                role: {json.dumps(e['SF_ROLE'])}
                warehouse: {json.dumps(e['SF_WAREHOUSE'])}
                database: {json.dumps(e['SF_DB'])}
                schema: {json.dumps(e['SF_SCHEMA'])}
                private_key_path: "/home/runner/sf_key.p8"
                private_key_passphrase: {json.dumps(e['SF_PASSPHRASE'])}
                threads: 4
          """
          pathlib.Path("datahub_refinery/profiles.yml").write_text(content)
          print("CI profiles.yml written for preprod")
          PYEOF

      # -----------------------------------------------------------------------
      # PRE-PROD always runs a FULL build of ALL models.
      # This is a promotion from TEST — we validate the entire model graph,
      # not just what changed in the last commit.
      # -----------------------------------------------------------------------
      - name: Build all dbt models (FULL build)
        working-directory: datahub_refinery
        run: |
          echo "FULL build — all models (PREPROD promotion)"
          dbt build \
            --select "path:models+" \
            --target preprod \
            --no-fail-fast \
            --profiles-dir .
        continue-on-error: true

      - name: Run dbt tests (all models)
        if: always()
        working-directory: datahub_refinery
        run: |
          dbt test \
            --select "path:models+" \
            --target preprod \
            --no-fail-fast \
            --profiles-dir .
        continue-on-error: true

      - name: Generate dbt test HTML report
        if: always()
        run: python scripts/dbt_report.py

      - name: Upload dbt test report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dbt_test_report_preprod
          path: dbt_test_report.html
          if-no-files-found: warn

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dbt_artifacts_preprod
          path: |
            datahub_refinery/target/manifest.json
            datahub_refinery/target/run_results.json
          if-no-files-found: ignore
          retention-days: 90
