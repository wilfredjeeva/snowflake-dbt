# POC: run a custom Python script against Snowflake using Environment secrets.
# Purpose  : Prove GitHub Actions can schedule/manually run non-dbt Python jobs
#             with the same Snowflake key-pair secrets as dbt CI.
# Trigger  : Manual only (workflow_dispatch). Replace the script path later
#             with the team's real automation script.

name: poc-python-snowflake
run-name: "POC Python → ${{ inputs.target_env }}  [${{ inputs.run_title }}]"

on:
  workflow_dispatch:
    inputs:
      run_title:
        description: "Name shown in the Actions run list"
        required: true
        type: string
        default: "Snowflake connect POC"
      target_env:
        description: "GitHub Environment (secrets) to use"
        required: true
        type: choice
        options:
          - DEV
          - test
          - preprod
          - prod
        default: DEV
      script_path:
        description: "Repo-relative Python script to run"
        required: true
        type: string
        default: "scripts/poc_snowflake_connect.py"

permissions:
  contents: read

jobs:
  run_python:
    name: "Python → ${{ inputs.target_env }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    timeout-minutes: 30

    steps:
      - name: Log parameters
        run: |
          echo "Title  : ${{ inputs.run_title }}"
          echo "Env    : ${{ inputs.target_env }}"
          echo "Script : ${{ inputs.script_path }}"
          echo "Actor  : ${{ github.actor }}"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "snowflake-connector-python>=3.12.0" cryptography

      - name: Write Snowflake private key
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > $HOME/sf_key.p8
          chmod 600 $HOME/sf_key.p8

      - name: Run Python script
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DB: ${{ secrets.SNOWFLAKE_DB }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_KEY_PASSPHRASE }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/sf_key.p8
        run: |
          set -euo pipefail
          SCRIPT="${{ inputs.script_path }}"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Script not found: $SCRIPT"
            exit 1
          fi
          python "$SCRIPT"

      - name: Cleanup private key
        if: always()
        run: rm -f $HOME/sf_key.p8
